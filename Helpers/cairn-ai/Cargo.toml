[package]
name = "cairn-ai"
version = "0.1.0"
edition = "2024"
publish = false
description = "Cairn's AI helper: speaks to the configured LLM endpoint over newline-delimited JSON on stdio."

[dependencies]
genai = "=0.7.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
